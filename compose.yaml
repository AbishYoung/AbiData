services:
  abidata:
    build: .
    restart: unless-stopped
    environment:
      ABIDATA_PUBLIC_URL: ${ABIDATA_PUBLIC_URL:-https://localhost}
      ABIDATA_SESSION_KEY_FILE: /run/secrets/session_key
      ABIDATA_MANIFEST_KEY_FILE: /run/secrets/manifest_key
      # First start with no users: the one-time setup token is logged for this address.
      ABIDATA_BOOTSTRAP_ADMIN_EMAIL: ${ABIDATA_BOOTSTRAP_ADMIN_EMAIL:-}
      # Trust X-Forwarded-For only from Caddy's fixed address on the internal network.
      ABIDATA_TRUSTED_PROXIES: ${ABIDATA_TRUSTED_PROXIES:-172.30.70.2}
      ABIDATA_ALLOWED_ORIGINS: ${ABIDATA_ALLOWED_ORIGINS:-}
    volumes:
      - abidata-data:/var/lib/abidata
      - abidata-backups:/var/lib/abidata-backups
    secrets:
      - session_key
      - manifest_key
    stop_grace_period: 45s
    networks:
      internal:
        ipv4_address: 172.30.70.3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - abidata
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ABIDATA_SITE: ${ABIDATA_SITE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        ipv4_address: 172.30.70.2

networks:
  # A fixed subnet so the app can trust exactly Caddy's address. Change all three
  # addresses together if 172.30.70.0/24 collides with a network you use.
  internal:
    ipam:
      config:
        - subnet: 172.30.70.0/24

secrets:
  session_key:
    file: ./secrets/session_key
  manifest_key:
    file: ./secrets/manifest_key

volumes:
  abidata-data:
  abidata-backups:
  caddy-data:
  caddy-config:
