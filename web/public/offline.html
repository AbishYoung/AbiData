<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1511" media="(prefers-color-scheme: dark)" />
    <title>Offline - AbiData</title>
    <style>
      :root { --bg: #f4f8f5; --fg: #10211a; --muted: #4a5060; --accent: #12803c; --accent-fg: #fff; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a1511; --fg: #eceef3; --muted: #a3a9b8; --accent: #44c27b; --accent-fg: #0a1511; }
      }
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 22rem; text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 1.25rem; display: block; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); }
      .retry { display: inline-flex; align-items: center; font-weight: 600; min-height: 44px; padding: 0 1.5rem; border-radius: .5rem; background: var(--accent); color: var(--accent-fg); text-decoration: none; }
      .retry:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12803c" /><stop offset="1" stop-color="#0f8a8f" /></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#g)" />
        <rect x="7" y="8" width="7.5" height="4" rx="1.5" fill="#fff" />
        <rect x="16.5" y="8" width="8.5" height="4" rx="1.5" fill="#fff" fill-opacity="0.75" />
        <rect x="7" y="14" width="18" height="4" rx="1.5" fill="#fff" fill-opacity="0.9" />
        <rect x="7" y="20" width="12" height="4" rx="1.5" fill="#fff" fill-opacity="0.6" />
      </svg>
      <h1>You're offline</h1>
      <p>AbiData needs a connection to reach your data. Check your network, then try again.</p>
      <a class="retry" href="/">Retry</a>
    </main>
  </body>
</html>
