name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web (embedded assets)
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated files are current
        run: |
          make gen
          git diff --exit-code -- internal/httpapi/openapi.json web/src/generated docs/content/reference/shortcuts.md docs/content/reference/expressions.md
      - name: Test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke:
    # Builds the linux/amd64 image, brings it up with compose from a clean volume, bootstraps via the
    # logged setup token and runs tests/e2e/smoke.spec.ts against it (same script as local runs).
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Container smoke
        run: ./scripts/container-smoke.sh
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-traces
          path: tests/e2e/test-results
          if-no-files-found: ignore
