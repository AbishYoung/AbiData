name: ci

# Layered and change-aware (ADR 0016). The plan job maps the changed paths to the layers they
# can affect with tools/testplan, the same selection `make test-changed` makes locally; each
# job below runs only when the plan needs it. Pushes to main, the nightly run and manual runs
# select everything.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      go: ${{ steps.plan.outputs.go }}
      go_packages: ${{ steps.plan.outputs.go_packages }}
      go_lint: ${{ steps.plan.outputs.go_lint }}
      web: ${{ steps.plan.outputs.web }}
      web_static: ${{ steps.plan.outputs.web_static }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_areas: ${{ steps.plan.outputs.e2e_areas }}
      image: ${{ steps.plan.outputs.image }}
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: plan
        name: Select the layers
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            args="-base origin/$BASE_REF"
          elif [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            args="-base origin/main"
          else
            args="-full"
          fi
          go run ./tools/testplan plan $args -github-output "$GITHUB_OUTPUT"

  go:
    needs: plan
    if: needs.plan.outputs.go == 'true' || needs.plan.outputs.go_lint == 'true' || needs.plan.outputs.web_static == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web (embedded assets)
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generated files are current
        run: |
          make gen
          git diff --exit-code -- internal/httpapi/openapi.json web/src/generated docs/content/reference/shortcuts.md docs/content/reference/expressions.md
      - name: Test
        if: needs.plan.outputs.go == 'true'
        env:
          PACKAGES: ${{ needs.plan.outputs.go_packages }}
        # Never -short here: the heavy tests the fast local layer skips run in CI.
        run: go test -race $PACKAGES
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: needs.plan.outputs.go_lint == 'true'
        with:
          version: v2.14.0

  web:
    needs: plan
    if: needs.plan.outputs.web == 'true' || needs.plan.outputs.web_static == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      # Every web test whenever web changes: the whole run takes seconds.
      - run: npm --prefix web test
      - run: npm --prefix web run build

  e2e-build:
    # Builds the web app and the binary once for every e2e area.
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          npm --prefix web ci
          npm --prefix web run build
          go build -o tests/e2e/.bin/abidata ./cmd/abidata
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-binary
          path: tests/e2e/.bin/abidata
          retention-days: 1

  e2e:
    needs: [plan, e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.e2e_areas) }}
    name: e2e (${{ matrix.area }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-binary
          path: tests/e2e/.bin
      - run: chmod +x tests/e2e/.bin/abidata
      - run: npm --prefix tests/e2e ci
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: Install Chromium
        working-directory: tests/e2e
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium || true
          else
            npx playwright install --with-deps chromium || npx playwright install chromium
          fi
      - name: Playwright (${{ matrix.area }})
        env:
          E2E_SKIP_BUILD: "1"
        run: go run ./tools/testplan e2e ${{ matrix.area }}
      - name: Upload traces and server logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-${{ matrix.area }}-traces
          path: |
            tests/e2e/test-results
            tests/e2e/.servers
          include-hidden-files: true
          if-no-files-found: ignore

  postgres:
    # The whole Go suite on PostgreSQL (ADR 0012 §10), once per supported server version, against
    # a service container bound to localhost. scripts/ci-postgres.sh replaces the service's
    # throwaway password with random, masked ones. Locally, make test-postgres does the same in
    # Docker.
    needs: plan
    if: needs.plan.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    name: postgres (${{ matrix.postgres }})
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare PostgreSQL
        run: ./scripts/ci-postgres.sh "${{ job.services.postgres.id }}" 5432
      - name: Test on PostgreSQL ${{ matrix.postgres }}
        env:
          ABIDATA_TEST_DB: postgres
        run: go test -race -count=1 ./...

  e2e-postgres:
    # The Playwright suite with every server on PostgreSQL (ADR 0012 §10), per area, on the
    # recommended server version, whenever both the e2e and the PostgreSQL layers are selected.
    needs: [plan, e2e-build]
    if: needs.plan.outputs.e2e == 'true' && needs.plan.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.e2e_areas) }}
    name: e2e on postgres (${{ matrix.area }})
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: e2e-binary
          path: tests/e2e/.bin
      - run: chmod +x tests/e2e/.bin/abidata
      - run: npm --prefix tests/e2e ci
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: Install Chromium
        working-directory: tests/e2e
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium || true
          else
            npx playwright install --with-deps chromium || npx playwright install chromium
          fi
      - name: Prepare PostgreSQL
        run: ./scripts/ci-postgres.sh "${{ job.services.postgres.id }}" 5432
      - name: Playwright on PostgreSQL (${{ matrix.area }})
        env:
          E2E_SKIP_BUILD: "1"
        run: go run ./tools/testplan e2e ${{ matrix.area }}
      - name: Upload traces and server logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-postgres-${{ matrix.area }}-traces
          path: |
            tests/e2e/test-results
            tests/e2e/.servers
          include-hidden-files: true
          if-no-files-found: ignore

  docker:
    needs: plan
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke:
    # Builds the linux/amd64 image, brings it up with compose from a clean volume, bootstraps via the
    # logged setup token and runs tests/e2e/smoke.spec.ts against it (same script as local runs).
    needs: [plan, go, web]
    if: ${{ !cancelled() && needs.plan.outputs.image == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Container smoke
        run: ./scripts/container-smoke.sh
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: container-smoke-traces
          path: tests/e2e/test-results
          if-no-files-found: ignore

  ci-ok:
    # One check for branch protection: fails if any selected job failed or was cancelled;
    # skipped jobs (not needed by this change) pass.
    needs: [plan, go, web, e2e-build, e2e, postgres, e2e-postgres, docker, container-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
