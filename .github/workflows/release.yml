name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make lint
      - run: make test-go-unit
      - run: make test-web

  build-binaries:
    needs: test-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web application
        run: make web-build
      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          OUT="bin/abidata-${TAG_VERSION}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=${TAG_VERSION}" -o "$OUT" ./cmd/abidata
      - uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/abidata-*

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: release-binaries
          merge-multiple: true
      - name: Generate Checksums
        run: |
          cd release-binaries
          sha256sum abidata-* > sha256sums.txt
          cat sha256sums.txt
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-binaries/* \
            --title "AbiData $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  docker-release:
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build multi-arch container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
