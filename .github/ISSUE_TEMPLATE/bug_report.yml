name: Bug report
description: Something in AbiData does not work as it should.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security vulnerabilities must not be reported here**: see [SECURITY.md](https://github.com/AbishYoung/AbiData/blob/main/SECURITY.md).
        Please remove passwords, tokens, API keys and personal data from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the workspace …
        2. In the Orders datasheet, …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AbiData version
      description: Shown under Admin → Overview, or run `abidata version`.
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker / Docker Compose
        - Release binary
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Database backend
      options:
        - SQLite (default)
        - PostgreSQL
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Datasheets / tables
        - Queries (visual or SQL)
        - Forms
        - Reports / PDF
        - Lua scripts / jobs
        - Import / export
        - Files / attachments / maps
        - Public apps / blogs
        - Messaging / members
        - Admin / backups / operations
        - REST API
        - Mobile / PWA
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Firefox 140 on Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server log lines (JSON logs are fine), browser console errors or screenshots. Remove secrets first.
      render: shell
