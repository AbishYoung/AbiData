# Dependency updates. Versions are pinned exactly everywhere, and a release is
# taken only once it is at least two weeks old (cooldown), as for hand updates.
# Minor and patch updates are grouped per ecosystem; majors come one PR each.
# Security updates ignore the schedule and the cooldown.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      go-minor:
        update-types: [minor, patch]
    labels: [dependencies, go]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      web-minor:
        update-types: [minor, patch]
    # typescript-eslint (<6.1) and openapi-typescript (^5) do not yet support TypeScript 6/7.
    ignore:
      - dependency-name: typescript
        versions: [">= 6.a"]
    labels: [dependencies, web]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      e2e-minor:
        update-types: [minor, patch]
    # Keep aligned with /web on TypeScript 5.x until web tooling supports >= 6.
    ignore:
      - dependency-name: typescript
        versions: [">= 6.a"]
    labels: [dependencies, e2e]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies, ci]

  # Base images in the Dockerfile and the images compose.yaml runs (the e2e
  # smoke compose file only uses the locally built image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # Dockerfile and CI pin the Node 24 Active LTS line; odd-numbered releases (25) are non-LTS.
    ignore:
      - dependency-name: node
        versions: [">= 25.a"]
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
