# Dependency updates. Versions are pinned exactly everywhere, and a release is
# taken only once it is at least two weeks old (cooldown), as for hand updates.
# Minor and patch updates are grouped per ecosystem; majors come one PR each.
# Security updates ignore the schedule and the cooldown.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      go-minor:
        update-types: [minor, patch]
    labels: [dependencies, go]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      web-minor:
        update-types: [minor, patch]
    labels: [dependencies, web]

  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      e2e-minor:
        update-types: [minor, patch]
    labels: [dependencies, e2e]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies, ci]

  # Base images in the Dockerfile and the images compose.yaml runs (the e2e
  # smoke compose file only uses the locally built image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, docker]
